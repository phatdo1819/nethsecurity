---
openapi: 3.1.0
info:
  title: NethSecurity RPCD APIs
  description: |
    Complete OpenAPI 3.1.0 specification for all `ns.*` RPCD API methods.
    
    ## How RPCD Methods Are Called
    
    Methods use the **ubus call convention** but are accessed through the nethsecurity-api Go server:
    
    1. **Device-side (direct ubus)**:
       ```bash
       ubus call ns.firewall list-zones '{"filter": "all"}'
       ```
    
    2. **Remote clients (via HTTP with JWT)**:
       ```bash
       POST /api/ubus/call
       {"path": "ns.firewall", "method": "list-zones", "payload": {"filter": "all"}}
       ```
    
    3. **OpenAPI paths**: `POST /ubus/{ns.name}/{method}`
    
    ## Error Handling
    
    All responses are HTTP 200, even for errors. The response JSON body indicates success or failure:
    - **Success**: `{data...}`
    - **API error**: `{"error": "error_code"}`
    - **Validation error**: `{"validation": {"errors": [...]}}`
  version: 3.5.3

servers:
  - url: "https://{host}/api"
    description: "Remote API (with JWT auth via nethsecurity-api)"
    variables:
      host:
        default: "192.168.1.1"
  - url: "http://localhost"
    description: "Local ubus calls (device-side)"

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error code (lowercase, snake_case)
          example: invalid_filter

    ValidationErrorDetail:
      type: object
      required: [parameter, message, value]
      properties:
        parameter:
          type: string
          description: Name of the parameter that failed validation
          example: filter
        message:
          type: string
          description: Validation error code (lowercase, snake_case)
          example: invalid_regex
        value:
          description: The value that failed validation
          example: example

    ValidationError:
      type: object
      required: [validation]
      properties:
        validation:
          type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ValidationErrorDetail"

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: success

    ThreatShieldDnsListEntry:
      type: object
      required:
        - address
        - description
      properties:
        address:
          type: string
          description: Domain name present in the local Threat Shield DNS list
          example: nethesis.it
        description:
          type: string
          description: Optional free-form description associated with the domain
          example: my allow1

    WireGuardResult:
      type: object
      required: [result]
      properties:
        result:
          type: string
          example: success

    WireGuardAuthMode:
      type: string
      enum: [key, key_password, key_password_otp]
      description: |
        `key` uses only the WireGuard keys. `key_password` requires also the username and password of the server's
        users database, `key_password_otp` requires also an OTP code. The login is enforced by the ns-wgauth package.
      example: key_password

    WireGuardServerParams:
      type: object
      required: [enabled, name, network, listen_port, public_endpoint]
      properties:
        enabled:
          type: boolean
        name:
          type: string
          example: Road warriors
        network:
          type: string
          description: VPN network of the clients, IPv4 CIDR
          example: 10.1.86.0/24
        listen_port:
          type: integer
          example: 51823
        public_endpoint:
          type: string
          description: IP address or host name written in the client configurations
          example: wireguard.example.com
        fallback_endpoints:
          type: array
          maxItems: 4
          description: >-
            Other addresses of the server, tried in order by the clients that support it when the public endpoint
            doesn't answer; host or host:port, IPv6 in brackets with a port. Missing on edit-server, they stay.
          items:
            type: string
          example: ["vpn2.example.com", "203.0.113.10:51821"]
        mtu:
          type: string
          description: Empty for auto-detection
          example: ""
        dns:
          type: array
          items:
            type: string
          example: ["192.168.1.1"]
        auth_mode:
          $ref: "#/components/schemas/WireGuardAuthMode"
        user_db:
          type: string
          description: Local users database, required unless auth_mode is key
          example: main
        auth_timeout:
          type: integer
          minimum: 300
          maximum: 604800
          description: Session length in seconds, default 28800
          example: 28800
        device_binding:
          type: boolean
          description: >-
            The peers log in only from the device enrolled for them, with a client that signs the login. Requires
            auth_mode other than key. Missing on edit-server, it keeps its value.
          example: false
        machine_id:
          type: boolean
          description: The enrolled device must also send the ID of its machine. Requires device_binding.
          example: false

    WireGuardPeerParams:
      type: object
      required: [instance, enabled, name, reserved_ip, pre_shared_key, route_all_traffic, remote_networks]
      properties:
        instance:
          type: string
          example: wg1
        enabled:
          type: boolean
        name:
          type: string
          example: Alice laptop
        reserved_ip:
          type: string
          example: 10.1.86.2
        pre_shared_key:
          type: boolean
        route_all_traffic:
          type: boolean
        local_networks:
          type: array
          description: Required if route_all_traffic is false
          items:
            type: string
          example: ["192.168.100.0/24"]
        remote_networks:
          type: array
          description: Must be empty on a server that requires the login
          items:
            type: string
          example: []
        mtu:
          type: string
          example: ""
        user:
          type: string
          description: User of the server's users database, required if the server requires the login
          example: alice

    WireGuardPeerId:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Peer id, from list-servers
          example: wg1_ns_76e103f5_peer

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/login

security:
  - BearerAuth: []

paths:
  POST /ubus/ns.ha/add-lan-interface:
    post:
      summary: Add a LAN interface to the HA keepalived configuration
      operationId: ns.ha.add-lan-interface
      tags:
        - ha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - primary_node_ip
                - backup_node_ip
                - virtual_ip
              properties:
                role:
                  type: string
                  enum: [primary, backup]
                  description: Node role executing the operation
                primary_node_ip:
                  type: string
                  description: Static IP of the interface on the primary node
                  example: 192.168.1.10
                backup_node_ip:
                  type: string
                  description: Static IP of the corresponding interface on the backup node
                  example: 192.168.1.11
                virtual_ip:
                  type: string
                  description: Virtual IP in CIDR notation
                  example: 192.168.1.1/24
      responses:
        "200":
          description: Interface added or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [success]
                    properties:
                      success:
                        type: boolean
                        example: true
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.reverseproxy/add-certificate:
    post:
      summary: Add a custom certificate
      operationId: ns.reverseproxy.add-certificate
      tags:
        - reverseproxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - certificate_path
                - key_path
              properties:
                name:
                  type: string
                  description: Certificate name, must be unique and conform to UCI name format
                  example: my_certificate
                certificate_path:
                  type: string
                  description: Path to PEM X.509 certificate file (must not be expired)
                  example: /tmp/cert.pem
                key_path:
                  type: string
                  description: Path to PEM private key file (must match the certificate)
                  example: /tmp/key.pem
                chain_path:
                  type: string
                  description: Optional path to PEM certificate chain file
                  example: /tmp/chain.pem
      responses:
        "200":
          description: Certificate successfully added
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: success
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-list-allowed:
    post:
      summary: List local Threat Shield DNS allowlist entries
      description: Returns the allowlist entries currently staged in UCI. They are written to the adblock file on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-list-allowed
      tags:
        - threatshield
      responses:
        "200":
          description: Staged allowlist entries
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ThreatShieldDnsListEntry"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-add-allowed:
    post:
      summary: Add a local Threat Shield DNS allowlist entry
      description: Stages the new allowlist entry in UCI. The physical adblock file is updated on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-add-allowed
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - description
              properties:
                address:
                  type: string
                  description: Domain to add to the local allowlist
                  example: nethesis.it
                description:
                  type: string
                  description: Free-form description for the domain
                  example: my allow1
      responses:
        "200":
          description: Allowlist entry staged or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-edit-allowed:
    post:
      summary: Edit a local Threat Shield DNS allowlist entry
      description: Updates the staged allowlist description in UCI. The physical adblock file is updated on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-edit-allowed
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - description
              properties:
                address:
                  type: string
                  description: Existing domain in the local allowlist
                  example: nethesis.it
                description:
                  type: string
                  description: Updated description for the domain
                  example: my new desc
      responses:
        "200":
          description: Allowlist entry updated or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-delete-allowed:
    post:
      summary: Delete a local Threat Shield DNS allowlist entry
      description: Removes the staged allowlist entry from UCI. The physical adblock file is updated on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-delete-allowed
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Existing domain in the local allowlist
                  example: nethesis.it
      responses:
        "200":
          description: Allowlist entry deleted or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-list-blocklist:
    post:
      summary: List available Threat Shield DNS blocklists
      operationId: ns.threatshield.dns-list-blocklist
      tags:
        - threatshield
      responses:
        "200":
          description: Available blocklists
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required:
                            - name
                            - type
                            - enabled
                            - confidence
                            - description
                          properties:
                            name:
                              type: string
                              description: Blocklist name
                              example: adguard
                            type:
                              type: string
                              enum: [enterprise, community]
                              description: Blocklist category
                              example: enterprise
                            enabled:
                              type: boolean
                              description: Whether the blocklist is enabled
                              example: true
                            confidence:
                              type: integer
                              description: Entitlement confidence score
                              example: 10
                            description:
                              type: [string, "null"]
                              description: Blocklist description
                              example: OpenDNS family shield
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-list-blocked:
    post:
      summary: List local Threat Shield DNS blocklist entries
      description: Returns the blocklist entries currently staged in UCI. They are written to the adblock file on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-list-blocked
      tags:
        - threatshield
      responses:
        "200":
          description: Staged blocklist entries
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ThreatShieldDnsListEntry"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-add-blocked:
    post:
      summary: Add a local Threat Shield DNS blocklist entry
      description: Stages the new blocklist entry in UCI. The physical adblock file is updated on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-add-blocked
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Domain to add to the local blocklist
                  example: nastydomain.net
                description:
                  type: string
                  description: Optional free-form description for the domain
                  example: my block1
      responses:
        "200":
          description: Blocklist entry staged or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-edit-blocked:
    post:
      summary: Edit a local Threat Shield DNS blocklist entry
      description: Updates the staged blocklist description in UCI. The physical adblock file is updated on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-edit-blocked
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Existing domain in the local blocklist
                  example: nastydomain.net
                description:
                  type: string
                  description: Updated description for the domain
                  example: My new desc
      responses:
        "200":
          description: Blocklist entry updated or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-delete-blocked:
    post:
      summary: Delete a local Threat Shield DNS blocklist entry
      description: Removes the staged blocklist entry from UCI. The physical adblock file is updated on the next reload triggered by `ns.commit` or `reload_config`.
      operationId: ns.threatshield.dns-delete-blocked
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Existing domain in the local blocklist
                  example: nastydomain.net
      responses:
        "200":
          description: Blocklist entry deleted or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-list-settings:
    post:
      summary: Get Threat Shield DNS enforcement settings
      operationId: ns.threatshield.dns-list-settings
      tags:
        - threatshield
      responses:
        "200":
          description: Current DNS enforcement settings
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - enabled
                          - zones
                          - ports
                        properties:
                          enabled:
                            type: boolean
                            description: Whether Threat Shield DNS is enabled
                            example: true
                          zones:
                            type: array
                            description: Firewall zones where DNS redirection is enforced
                            items:
                              type: string
                            example: [lan]
                          ports:
                            type: array
                            description: DNS ports enforced locally
                            items:
                              type: string
                            example: ["53", "853"]
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-list-zones:
    post:
      summary: List firewall zones available for Threat Shield DNS
      operationId: ns.threatshield.dns-list-zones
      tags:
        - threatshield
      responses:
        "200":
          description: Available zones
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-edit-blocklist:
    post:
      summary: Enable or disable a Threat Shield DNS blocklist
      operationId: ns.threatshield.dns-edit-blocklist
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - blocklist
                - enabled
              properties:
                blocklist:
                  type: string
                  description: DNS blocklist name
                  example: adguard
                enabled:
                  type: boolean
                  description: Whether the blocklist should be enabled
                  example: true
      responses:
        "200":
          description: Blocklist updated or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: success
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-edit-settings:
    post:
      summary: Update Threat Shield DNS enforcement settings
      operationId: ns.threatshield.dns-edit-settings
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: Enable or disable Threat Shield DNS
                  example: true
                zones:
                  type: array
                  description: Firewall zones where DNS redirection is enforced
                  items:
                    type: string
                  example: [lan]
                ports:
                  type: array
                  description: DNS ports enforced locally
                  items:
                    type: string
                  example: ["53", "853"]
      responses:
        "200":
          description: Settings updated or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: success
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-list-bypass:
    post:
      summary: List Threat Shield DNS bypass entries
      operationId: ns.threatshield.dns-list-bypass
      tags:
        - threatshield
      responses:
        "200":
          description: DNS bypass entries
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-add-bypass:
    post:
      summary: Add a Threat Shield DNS bypass entry
      operationId: ns.threatshield.dns-add-bypass
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Source IP address or subnet that should bypass DNS redirection
                  example: 192.168.1.22
      responses:
        "200":
          description: Bypass entry added or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: success
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.threatshield/dns-delete-bypass:
    post:
      summary: Delete a Threat Shield DNS bypass entry
      operationId: ns.threatshield.dns-delete-bypass
      tags:
        - threatshield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Source IP address or subnet to remove from the DNS bypass list
                  example: 192.168.1.22
      responses:
        "200":
          description: Bypass entry removed or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: success
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.wireguard/list-servers:
    post:
      summary: List the WireGuard servers and their peers, with the login state
      operationId: ns.wireguard.list-servers
      tags:
        - wireguard
      responses:
        "200":
          description: WireGuard servers
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: wg1
                        name:
                          type: string
                        enabled:
                          type: boolean
                        public_endpoint:
                          type: string
                        fallback_endpoints:
                          type: array
                          description: As written by the administrator, without the default port
                          items:
                            type: string
                        auth_mode:
                          $ref: "#/components/schemas/WireGuardAuthMode"
                        user_db:
                          type: string
                          description: Empty in key mode
                        auth_timeout:
                          type: integer
                        login_url:
                          type: string
                          description: Login page of the peers, empty in key mode
                          example: http://10.1.86.1:8181/
                        auth_enforced:
                          type: boolean
                          description: False when the login is required but the firewall doesn't enforce it
                        auth_blocked:
                          type: boolean
                          description: True when the login rules couldn't be loaded and the whole VPN is blocked
                        device_binding:
                          type: boolean
                        machine_id:
                          type: boolean
                        peers:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              reserved_ip:
                                type: string
                              config:
                                type: string
                                description: >-
                                  Client configuration, with a "# Login = URL" comment if the login is required and a
                                  "# Fallback = host:port, ..." comment if the server has fallback endpoints
                              user:
                                type: string
                                description: Linked user, empty if none
                              authenticated:
                                type: boolean
                              auth_expires:
                                type: string
                                format: date-time
                                description: Present only while authenticated
                              blocked:
                                type: boolean
                                description: Blocked after a suspected copy of its configuration
                              device:
                                type: object
                                description: Only on a server with device_binding
                                properties:
                                  state:
                                    type: string
                                    enum: [enrolled, waiting, closed]
                                  enrollment_until:
                                    type: string
                                    format: date-time
                                    description: Only while waiting
                                  name:
                                    type: string
                                    example: LAPTOP-42
                                  kind:
                                    type: string
                                    example: software
                                  machine_id:
                                    type: boolean
                                    description: True if the ID of its machine is recorded
                                  enrolled:
                                    type: string
                                    format: date-time
                                  last_used:
                                    type: string
                                    format: date-time
                                  from:
                                    type: string
                                    description: Public IP of its latest login
                                    example: 203.0.113.7
                              alerts:
                                type: array
                                description: Suspected copies, lockouts and logins from another device, newest first
                                items:
                                  type: object
                                  properties:
                                    time:
                                      type: string
                                      format: date-time
                                    type:
                                      type: string
                                      enum: [copy, lockout, device_mismatch]
                                    addresses:
                                      type: array
                                      items:
                                        type: string
                                      example: ["198.51.100.20", "203.0.113.7"]
  POST /ubus/ns.wireguard/add-server:
    post:
      summary: Add a WireGuard server
      operationId: ns.wireguard.add-server
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireGuardServerParams"
      responses:
        "200":
          description: Server added or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
  POST /ubus/ns.wireguard/edit-server:
    post:
      summary: Edit a WireGuard server
      description: Without auth_mode, the login options keep their current values.
      operationId: ns.wireguard.edit-server
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WireGuardServerParams"
                - type: object
                  required: [instance]
                  properties:
                    instance:
                      type: string
                      example: wg1
      responses:
        "200":
          description: Server edited or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
  POST /ubus/ns.wireguard/add-peer:
    post:
      summary: Add a peer to a WireGuard server
      operationId: ns.wireguard.add-peer
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireGuardPeerParams"
      responses:
        "200":
          description: Peer added or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
  POST /ubus/ns.wireguard/edit-peer:
    post:
      summary: Edit a peer of a WireGuard server
      description: Without user, the peer keeps its current user.
      operationId: ns.wireguard.edit-peer
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WireGuardPeerParams"
                - $ref: "#/components/schemas/WireGuardPeerId"
      responses:
        "200":
          description: Peer edited or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
  POST /ubus/ns.wireguard/logout-peer:
    post:
      summary: End the login session of a peer
      description: The peer must log in again to use the VPN. No configuration changes, no commit needed.
      operationId: ns.wireguard.logout-peer
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireGuardPeerId"
      responses:
        "200":
          description: Session ended, or there was none
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.wireguard/download-peer-2fa:
    post:
      summary: Return the OTP QR code of the user linked to a peer
      operationId: ns.wireguard.download-peer-2fa
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireGuardPeerId"
      responses:
        "200":
          description: QR code as SVG, or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: string
                        description: SVG image
                  - $ref: "#/components/schemas/ValidationError"
  POST /ubus/ns.wireguard/regenerate-peer-keys:
    post:
      summary: Give a server peer new keys
      description: >-
        New private and public keys, and a new pre-shared key if the peer has one. Once committed, the current
        configuration of the peer and every copy of it stop working; the alerts of the peer are dropped.
      operationId: ns.wireguard.regenerate-peer-keys
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireGuardPeerId"
      responses:
        "200":
          description: Keys saved, to be committed, or validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.wireguard/clear-peer-alerts:
    post:
      summary: Forget the alerts of a peer and unblock it
      description: No configuration changes, no commit needed.
      operationId: ns.wireguard.clear-peer-alerts
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireGuardPeerId"
      responses:
        "200":
          description: Alerts cleared, or there were none
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.wireguard/allow-device-enrollment:
    post:
      summary: Forget the device of a peer and let a new one enroll at its next login
      description: Only on a server with device_binding. No configuration changes, no commit needed.
      operationId: ns.wireguard.allow-device-enrollment
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WireGuardPeerId"
                - type: object
                  properties:
                    hours:
                      type: integer
                      minimum: 1
                      maximum: 720
                      description: How long the enrollment stays open, default 72
      responses:
        "200":
          description: Enrollment open
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      result:
                        type: string
                        example: success
                      enrollment_until:
                        type: string
                        format: date-time
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.wireguard/revoke-device:
    post:
      summary: Forget the device of a peer and end its session
      description: >-
        Only on a server with device_binding. The peer can't log in until a new enrollment is allowed. No
        configuration changes, no commit needed.
      operationId: ns.wireguard.revoke-device
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireGuardPeerId"
      responses:
        "200":
          description: Device revoked
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireGuardResult"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.wireguard/connection-history:
    post:
      summary: Read a page of the connection history of the peers of the servers
      description: >-
        Recorded every minute from the handshakes and the counters of WireGuard, see nethsec.wghistory. Empty
        without a history yet.
      operationId: ns.wireguard.connection-history
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instances:
                  type: array
                  description: The servers to include, all if empty
                  items:
                    type: string
                  example: ["wg1"]
                q:
                  type: string
                  description: Text in the name of the peer, its user, its addresses or its server
                start_time:
                  type: integer
                  description: Only the connections started from this time, seconds since 1970
                accounts:
                  type: array
                  description: The names of the peers to include, all if empty
                  items:
                    type: string
                page:
                  type: integer
                  minimum: 1
                  default: 1
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 10
                sort_by:
                  type: string
                  enum: [startTime, endTime, duration, account, user, instance, virtualIpAddress, remoteIpAddress,
                         bytesReceived, bytesSent]
                  default: startTime
                desc:
                  type: boolean
                  default: true
      responses:
        "200":
          description: A page of the history
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      connections:
                        type: array
                        items:
                          type: object
                          properties:
                            instance:
                              type: string
                              example: wg1
                            peer:
                              type: string
                            account:
                              type: string
                              description: The name of the peer at the time of the connection
                            user:
                              type: string
                              description: The linked user, empty if none
                            virtualIpAddress:
                              type: string
                            remoteIpAddress:
                              type: string
                            startTime:
                              type: integer
                            endTime:
                              type: [integer, "null"]
                              description: Null while connected
                            duration:
                              type: integer
                            connected:
                              type: boolean
                            bytesReceived:
                              type: integer
                              description: From the peer
                            bytesSent:
                              type: integer
                              description: To the peer
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                        description: All the rows of the history
                      results:
                        type: integer
                        description: The rows that match the filters
                      filters:
                        type: object
                        properties:
                          accounts:
                            type: array
                            items:
                              type: string
                          instances:
                            type: array
                            items:
                              type: string
                      server_names:
                        type: object
                        additionalProperties:
                          type: string
                        example: {"wg1": "HQ"}
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
  POST /ubus/ns.wireguard/connection-history-csv:
    post:
      summary: Write all the connection history in a CSV file of the downloads
      operationId: ns.wireguard.connection-history-csv
      tags:
        - wireguard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instances:
                  type: array
                  items:
                    type: string
                timezone:
                  type: string
                  description: The time zone of the times, UTC if missing or unknown
                  example: Europe/Rome
      responses:
        "200":
          description: The path of the CSV file
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      csv_path:
                        type: string
                        example: /var/run/ns-api-server/downloads/wireguard_connection_history.csv
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
